name: probe

on:
  schedule:
    - cron: "17 2 * * 1"      # 每周一 10:17（北京时间）
  workflow_dispatch:
  push:
    paths:
      - "campus-licensed.yaml"
      - "scripts/probe.py"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: 探测所有域名（DNS + TLS + 证书 SAN）
        run: |
          set -o pipefail
          python3 scripts/probe.py --json probe.json | tee report.md

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: |
            report.md
            probe.json
